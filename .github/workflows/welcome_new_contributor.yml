name: Welcome New Contributor

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Get contributor info
        id: contributor
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            USERNAME="${{ github.event.pull_request.user.login }}"
            IS_FIRST_CONTRIBUTION="${{ github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' }}"
          else
            USERNAME="${{ github.event.issue.user.login }}"
            IS_FIRST_CONTRIBUTION="${{ github.event.issue.author_association == 'FIRST_TIME_CONTRIBUTOR' }}"
          fi
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "is_first_contribution=$IS_FIRST_CONTRIBUTION" >> $GITHUB_OUTPUT

      - name: Add label to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // const isFirstContribution = '${{ steps.contributor.outputs.is_first_contribution }}' === 'FIRST_TIME_CONTRIBUTOR';
            const isFirstContribution = true
            
            if (isFirstContribution) {
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['new contributor']
              });
            }

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // const isFirstContribution = '${{ steps.contributor.outputs.is_first_contribution }}' === 'FIRST_TIME_CONTRIBUTOR';
            const isFirstContribution = true
            
            if (isFirstContribution) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `Welcome @${{ steps.contributor.outputs.username }} and thank you for your contribution to OpenMS! To help us better understand our userbase and contributors, we would appreciate if you could complete the survey at the link below. Completing this survey will help us get to your PR sooner. Thank you for your participation!\n\n[Survey](https://tally.so/r/pbV6Qq) `
              });
            }

      - name: Add label to Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            // const isFirstContribution = '${{ steps.contributor.outputs.is_first_contribution }}' === 'FIRST_TIME_CONTRIBUTOR';
            const isFirstContribution = true
            
            if (isFirstContribution) {
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['new contributor']
              });
            }

      - name: Comment on Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            // const isFirstContribution = '${{ steps.contributor.outputs.is_first_contribution }}' === 'FIRST_TIME_CONTRIBUTOR';
            const isFirstContribution = true
            
            if (isFirstContribution) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `Welcome @${{ steps.contributor.outputs.username }} and thank you for your contribution to OpenMS! To help us better understand our userbase and contributors, we would appreciate if you could complete the survey at the link below. Completing this survey will help us get to your issue sooner. Thank you for your participation!\n\n[Survey](https://tally.so/r/pbV6Qq)`
              });
            }
